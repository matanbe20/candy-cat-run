<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candy Cat Run · Style Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1233;
    --paper: #fffaf0;
    --yellow: #ffe14d;
    --pink: #ff7ab6;
    --purple: #9b4dff;
    --teal: #27c3d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; }
  body { font-family: 'Rubik', system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  #scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #speedlines { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Loading ---------- */
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; background: #9fd3ff;
    font-family: 'Bangers', Impact, sans-serif; font-size: 42px; letter-spacing: 2px; color: #fff;
    text-shadow: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink), 4px 5px 0 var(--ink);
    z-index: 50; transition: opacity .4s;
  }
  #loading.gone { opacity: 0; pointer-events: none; }

  /* ---------- HUD mockup (Hebrew, RTL) ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Rubik', sans-serif; z-index: 5; }
  #hud.hidden { display: none; }
  .hud-row {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 14px; right: 14px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .hud-group { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--yellow); border: 4px solid var(--ink);
    border-radius: 22px 14px 24px 12px; box-shadow: 4px 5px 0 var(--ink);
    padding: 3px 14px 5px;
  }
  .chip.score { transform: rotate(-3deg); flex-direction: column; align-items: stretch; gap: 0; padding: 2px 16px 4px; }
  .chip.candies { background: var(--pink); transform: rotate(2.5deg); margin-top: 6px; }
  .chip .lbl { font-weight: 800; font-size: 14px; line-height: 1.1; color: var(--ink); }
  .num {
    font-weight: 900; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.05; color: #fff; letter-spacing: 1px;
    text-shadow:
      3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink),
      2px 2px var(--ink), -2px -2px var(--ink), 2px -2px var(--ink), -2px 2px var(--ink),
      4px 5px 0 var(--ink);
  }
  .chip.candies .num { font-size: clamp(20px, 3.6vw, 28px); }
  .candy-icon { width: 46px; height: 28px; flex: none; }
  .hearts { display: flex; gap: 4px; transform: rotate(-2deg); margin-top: 4px; }
  .heart { width: clamp(30px, 5.5vw, 42px); height: auto; filter: drop-shadow(3px 4px 0 var(--ink)); }
  .heart:nth-child(2) { transform: translateY(-3px) rotate(6deg); }
  .pause {
    pointer-events: auto; cursor: pointer; width: 58px; height: 58px; flex: none;
    border-radius: 50%; border: 4px solid var(--ink); background: var(--purple);
    box-shadow: 4px 5px 0 var(--ink); transform: rotate(4deg);
    display: grid; place-items: center; padding: 0;
    transition: transform .12s;
  }
  .pause:active { transform: rotate(4deg) translate(3px, 4px); box-shadow: 1px 1px 0 var(--ink); }
  .pause svg { width: 26px; height: 26px; }
  .hud-tag {
    position: absolute; top: max(92px, calc(env(safe-area-inset-top) + 80px)); right: 18px;
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,.85); border: 2px solid var(--ink);
    border-radius: 10px; padding: 1px 8px; transform: rotate(-2deg);
  }

  /* ---------- Style Lab panel (dev-facing, English) ---------- */
  .panel {
    position: fixed; left: 12px; bottom: 12px; z-index: 10; width: 286px; max-height: calc(100% - 120px);
    display: flex; flex-direction: column;
    background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 5px 6px 0 var(--ink);
    font-size: 13px; direction: ltr;
  }
  .panel-head {
    all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; font-family: 'Bangers', Impact, sans-serif; font-size: 24px; letter-spacing: 1.5px;
    border-bottom: 3px solid var(--ink); background: var(--yellow); border-radius: 14px 14px 0 0;
  }
  .panel.collapsed .panel-head { border-bottom: none; border-radius: 14px; }
  .panel.collapsed .panel-body { display: none; }
  .panel-head .chev { font-family: 'Rubik', sans-serif; font-size: 16px; transition: transform .2s; }
  .panel.collapsed .chev { transform: rotate(180deg); }
  .panel-body { padding: 8px 12px 12px; overflow-y: auto; }
  .group { margin-top: 8px; }
  .group-title { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .btns { display: flex; flex-wrap: wrap; gap: 5px; }
  .panel button.b {
    font: 700 13px 'Rubik', sans-serif; color: var(--ink); cursor: pointer;
    background: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 4px 9px;
    box-shadow: 2px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .panel button.b:hover { background: #fff6c9; }
  .panel button.b:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
  .panel button.b.on { background: var(--teal); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .panel button.b.wide { flex: 1 1 100%; }
  .seg { display: flex; }
  .seg button.b { flex: 1; border-radius: 0; margin-left: -3px; }
  .seg button.b:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
  .seg button.b:last-child { border-radius: 0 10px 10px 0; }
  .panel label.chk { display: flex; align-items: center; gap: 7px; font-weight: 600; margin: 4px 0; cursor: pointer; }
  .panel input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--purple); }
  .panel input[type=range] { width: 100%; accent-color: var(--purple); }
  .kbd { font-size: 11px; opacity: .65; margin-top: 8px; line-height: 1.5; }

  .badge {
    position: fixed; right: 12px; bottom: 12px; z-index: 4; pointer-events: none;
    font-family: 'Bangers', Impact, sans-serif; letter-spacing: 1.5px; font-size: 20px; color: #fff;
    background: var(--purple); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 4px 0 var(--ink);
    padding: 3px 12px; transform: rotate(-2deg);
  }
  .badge small { display: block; font-family: 'Rubik', sans-serif; font-size: 11px; letter-spacing: 0; font-weight: 600; }

  @media (max-width: 640px) {
    .panel { width: calc(100% - 24px); max-height: 52%; }
    .badge { display: none; }
    .hud-tag { display: none; }
    .chip .lbl { font-size: 12px; }
    .pause { width: 50px; height: 50px; }
  }
</style>

      <svg class="heart" viewBox="0 0 32 30"><path d="M16 28C6 21 1.5 15 1.5 9.5 1.5 5 5 1.8 9 1.8c3 0 5.5 1.8 7 4.2 1.5-2.4 4-4.2 7-4.2 4 0 7.5 3.2 7.5 7.7C30.5 15 26 21 16 28Z" fill="#ff4d6d" stroke="#1d1233" stroke-width="3" stroke-linejoin="round"/><ellipse cx="9.5" cy="8.5" rx="3.2" ry="2.1" fill="#fff" opacity=".9" transform="rotate(-30 9.5 8.5)"/></svg>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   1. CONFIG / CONSTANTS  —  every look-related value lives in STYLE
   ===================================================================== */
const STYLE = {
  outline: {
    enabled: true,
    thickness: 0.022,          // world units, pushed out along view-space normals
    color: '#1d1233',          // deep ink purple (reads softer than pure black)
  },
  toon: {
    steps: 3,                  // 2 | 3 | 4 hard shading bands
    ramps: {                   // brightness of each band, dark -> light
      2: [0.52, 1.0],
      3: [0.4, 0.72, 1.0],
      4: [0.32, 0.55, 0.78, 1.0],
    },
  },
  light: {
    sunColor: '#fff3e0', sunIntensity: 2.3, sunDir: [-4, 10, 7],
    hemiSky: '#dcefff', hemiGround: '#ffd9c7', hemiIntensity: 1.15,
  },
  sky: { top: '#3f9dff', mid: '#9fd3ff', horizon: '#ffe5f1', fogNear: 30, fogFar: 98 },
  shadow: { color: '#2a1d52', opacity: 0.32 },
  backdrop: {                  // candy-land skyline behind the houses
    haze: 0.3,                 // flat aerial-perspective tint toward the horizon colour
    mistAmount: 0.42,          // extra haze at the mountain feet...
    mistHeight: 16,            // ...fading out by this height (world units)
    outlineSide: 9,            // outline multipliers (they are far away, so thicker in world units)
    outlineFar: 16,
  },
  comic: { font: "'Bangers', Impact, 'Arial Black', sans-serif", ink: '#1d1233' },
  palette: {
    heroine: {
      fur: '#ffffff', nose: '#ff8fb3', innerEar: '#ffb0c8', blush: '#ff9ec4', mouth: '#6b2e48',
      iris: ['#b84800', '#ff8a1c', '#ffd56b'],          // outer, mid, inner (copper)
      bow: '#a04dff', bowDark: '#6f23d6', collar: '#8a3cf0',
    },
    tabby:  { fur: '#a7adba', stripe: '#5d6373', belly: '#dfe2e8', nose: '#b56a7c', innerEar: '#d9909f', brow: '#3b3548', iris: ['#6e8410', '#c3dd3a', '#f2ffa6'] },
    black:  { fur: '#3b3652', stripe: null,      belly: '#4f4969', nose: '#8d5a70', innerEar: '#8d5a70', brow: '#16101f', iris: ['#a86f00', '#ffcc1a', '#fff4a8'] },
    ginger: { fur: '#ff9542', stripe: '#e2661c', belly: '#ffdcb3', nose: '#d96f7c', innerEar: '#f08a96', brow: '#7a3410', iris: ['#2f8a1a', '#7fd957', '#d9ffb5'], scar: '#a8384f' },
    candy: {
      lolliA: '#ff3d7f', lolliB: '#9b4dff', stick: '#fffaf3',
      wrapped: '#27c3d8', wrappedDark: '#138da0',
      choco: '#6e3b22', chocoLight: '#8a4d2d', chocoWrap: '#e8323c', foil: '#ffd54a',
      liner: '#ff7ab6', linerLight: '#ffc2dd', frosting: '#fff3f9', frostingPink: '#ffaad3', cherry: '#e8182f',
    },
    street: {
      road: '#5a6684', laneLine: 'rgba(255,255,255,0.55)', curb: '#e6dfd5', sidewalk: '#f2dcbc', sidewalkLine: '#d8bf9b',
      grass: '#7fd65a', grassDark: '#62bf43',
    },
    houses: ['#ffb4a2', '#ffd97a', '#9fd8ff', '#c8b6ff', '#a8e6a3', '#ffc4e1', '#ffe3b3'],
    roofs: ['#e84a5f', '#5b6cff', '#2ec4a6', '#ff7b39', '#8b5cf6', '#d9455f'],
    doors: ['#5b6cff', '#e84a5f', '#2ec4a6', '#8b5cf6', '#ff7b39'],
    leaves: ['#4cc95a', '#6bd94a', '#3fb98a', '#8ad94a'],
    trash: '#5aa9a0', box: '#dca664', pot: '#e07a4f', car: '#ff5d5d', wood: '#c98a4b', metal: '#4a4f73',
  },
};

const LAYOUT = {
  laneX: [-2, 0, 2],
  roadWidth: 6.4,
  sidewalkWidth: 2.6,
  streetFrom: 22, streetTo: -110,
};

const VIEWS = {
  showcase: { pos: [3.6, 2.5, 5.2], target: [0, 0.75, -2.2] },
  game:     { pos: [0, 2.55, 5.0],  target: [0, 1.05, -5] },
  showcasePortrait: { pos: [1.4, 2.6, 6.4], target: [0, 0.8, -2.4] },
  gamePortrait:     { pos: [0, 2.8, 5.6],   target: [0, 1.0, -5] },
};
const viewFor = (name) => (window.innerWidth < window.innerHeight && VIEWS[name + 'Portrait']) || VIEWS[name];

/* small utilities */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = (t) => Math.min(1, Math.max(0, t));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutBack = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];

/* wait for the web fonts so canvas-drawn comic text uses them */
await Promise.race([
  Promise.all([document.fonts.load("80px 'Bangers'"), document.fonts.load("900 30px 'Rubik'")]).then(() => document.fonts.ready),
  new Promise(r => setTimeout(r, 3000)),
]);

/* =====================================================================
   2. RENDERER / SCENE / CAMERA / LIGHTS
   ===================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(STYLE.sky.horizon, STYLE.sky.fogNear, STYLE.sky.fogFar);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.fromArray(viewFor('showcase').pos);

const controls = new OrbitControls(camera, canvas);
controls.target.fromArray(viewFor('showcase').target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

const hemi = new THREE.HemisphereLight(STYLE.light.hemiSky, STYLE.light.hemiGround, STYLE.light.hemiIntensity);
scene.add(hemi);
const sun = new THREE.DirectionalLight(STYLE.light.sunColor, STYLE.light.sunIntensity);
sun.position.fromArray(STYLE.light.sunDir);
scene.add(sun);

/* =====================================================================
   3. MATERIALS & STYLE SYSTEM  (toon ramp, outlines, texture helpers)
   ===================================================================== */

// --- toon gradient map: N hard-edged bands, NearestFilter so there's no blending
function makeGradientMap(steps) {
  const ramp = STYLE.toon.ramps[steps];
  const data = new Uint8Array(ramp.length * 4);
  ramp.forEach((v, i) => { const b = Math.round(v * 255); data.set([b, b, b, 255], i * 4); });
  const tex = new THREE.DataTexture(data, ramp.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
let gradientMap = makeGradientMap(STYLE.toon.steps);
const TOON_MATS = [];
const MAT_CACHE = new Map();

function toon(color, opts = {}) {
  const key = 'toon|' + color + '|' + (opts.map ? opts.map.uuid : '') + '|' + (opts.transparent ? 't' : '') + '|' + (opts.side ?? '');
  let m = MAT_CACHE.get(key);
  if (!m) {
    m = new THREE.MeshToonMaterial({ color, gradientMap, map: opts.map || null, transparent: !!opts.transparent, side: opts.side ?? THREE.FrontSide });
    MAT_CACHE.set(key, m);
    TOON_MATS.push(m);
  }
  return m;
}
function flat(color, opts = {}) {
  const key = 'flat|' + color + '|' + (opts.map ? opts.map.uuid : '') + '|' + (opts.opacity ?? 1);
  let m = MAT_CACHE.get(key);
  if (!m) {
    m = new THREE.MeshBasicMaterial({ color, map: opts.map || null, transparent: (opts.opacity ?? 1) < 1, opacity: opts.opacity ?? 1, depthWrite: (opts.opacity ?? 1) >= 1 });
    MAT_CACHE.set(key, m);
  }
  return m;
}
// distant backdrop materials: no scene fog (it would erase them), a soft haze + ground mist instead
const HAZE_UNIFORMS = {
  hazeColor: { value: new THREE.Color(STYLE.sky.horizon) },
  haze: { value: STYLE.backdrop.haze },
  mistAmount: { value: STYLE.backdrop.mistAmount },
  mistHeight: { value: STYLE.backdrop.mistHeight },
};
const HAZE_GLSL = /* glsl */`
  uniform vec3 hazeColor;
  uniform float haze;

function comicTex(text, o = {}) {
  const { w = 512, h = 320, shape = 'burst', fill = '#ffe14d', textFill = '#ff3b5c', spikes = 14, seed = 3, font = 130, tilt = -0.06, tail = false } = o;
  return canvasTex(w, h, (g) => {

    const cx = w / 2, cy = h / 2 - (tail ? h * 0.08 : 0);
    const rx = w * 0.42, ry = h * (tail ? 0.32 : 0.4);
    const pts = [];

      const n = spikes * 2;
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + (rnd() - 0.5) * 0.12;
        const r = i % 2 === 0 ? 1 : (shape === 'burst' ? 0.7 : 0.86) + rnd() * 0.06;
        pts.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);

    const tailPts = tail ? [[cx - w * 0.07, cy + ry * 0.62], [cx - w * 0.02, h - 12], [cx + w * 0.07, cy + ry * 0.62]] : null;
    const path = (pp) => { g.beginPath(); pp.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };

      g.save(); g.translate(9, 9); g.fillStyle = ink; path(pts); g.fill(); if (tailPts) { path(tailPts); g.fill(); } g.restore();
      g.lineWidth = 13; g.strokeStyle = ink;
      if (tailPts) { path(tailPts); g.stroke(); }
      path(pts); g.stroke();
      g.fillStyle = fill;
      if (tailPts) { path(tailPts); g.fill(); }
      path(pts); g.fill();
    }
    g.save(); g.translate(cx, cy + 4); g.rotate(tilt);
    let fs = font;
    const maxW = pts.length ? rx * 1.42 : w * 0.88;
    g.font = `${fs}px ${STYLE.comic.font}`;
    while (g.measureText(text).width > maxW && fs > 20) { fs -= 4; g.font = `${fs}px ${STYLE.comic.font}`; }

    g.fillStyle = ink; g.fillText(text, 6, 7);
    g.lineWidth = Math.max(8, fs * 0.15); g.strokeStyle = ink; g.strokeText(text, 0, 0);

const starGeo = (() => {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1, a = i / 10 * Math.PI * 2 + Math.PI / 2;
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.14, bevelSize: 0.12, bevelSegments: 2 });
  g.center();
  return g;
})();

// a chain of nested segments (tails). Each segment's local +Y is the growth direction.
function tailChain(parent, mat, { n = 6, r0 = 0.07, r1 = 0.05, seg = 0.11, curl = 0.2, curlAxis = 'x', tufts = 0, outline = 1 } = {}) {
  const segs = [];
  let p = parent;
  for (let i = 0; i < n; i++) {
    const s = group(p, [0, i === 0 ? 0 : seg, 0]);
    s.rotation[curlAxis] = curl;
    const r = lerp(r0, r1, i / (n - 1));
    part(G.sphere, mat, { pos: [0, seg * 0.5, 0], scale: [r, Math.max(seg * 0.78, r * 1.15), r], parent: s, outline });
    s.userData.baseCurl = curl;
    segs.push(s);
    p = s;
  }
  if (tufts) {
    const tip = segs[n - 1];
    for (let k = 0; k < tufts; k++) {
      const a = (k / tufts - 0.5) * 1.6;
      part(cone(r1 * 0.9, r1 * 3.2, 7), mat, { pos: [0, seg * 1.05, 0], rot: [a * 0.5, 0, a], parent: tip, outline });
    }
    // a couple of messy side tufts mid-tail
    for (const [i, side] of [[2, 1], [4, -1]]) {
      if (!segs[i]) continue;
      const r = lerp(r0, r1, i / (n - 1));
      part(cone(r * 0.6, r * 2.4, 6), mat, { pos: [side * r * 0.8, seg * 0.5, 0], rot: [0, 0, -side * 1.9], parent: segs[i], outline });
    }
  }
  return segs;
}

function eyeMaterial(iris, pupil) { const key = iris.join() + pupil; if (!eyeMaterial.c[key]) eyeMaterial.c[key] = new THREE.MeshBasicMaterial({ map: eyeTex(iris, pupil) }); return eyeMaterial.c[key]; }
eyeMaterial.c = {};

// whisker: pivot at muzzle, extends outward along +/-X, optional mid-length bend
function whisker(parent, mat, s, y, z, x0, len, tilt, bend = 0) {
  const g = group(parent, [s * x0, y, z]);
  g.rotation.set(0, s * 0.35, s * tilt);
  const l1 = bend ? len * 0.5 : len;
  const c1 = new THREE.Mesh(cyl(0.0055, 0.0055, l1, 5), mat);
  c1.rotation.z = Math.PI / 2; c1.position.x = s * l1 / 2; g.add(c1);
  if (bend) {
    const g2 = group(g, [s * l1, 0, 0]);
    g2.rotation.z = -s * bend;
    const c2 = new THREE.Mesh(cyl(0.0055, 0.0055, len - l1, 5), mat);
    c2.rotation.z = Math.PI / 2; c2.position.x = s * (len - l1) / 2; g2.add(c2);
  }
  return g;
}

/* ---------- HEROINE: white British Shorthair with a purple bow ---------- */
function buildHeroine() {
  const C = PAL.heroine;
  const fur = toon(C.fur), pink = toon(C.nose), innerEar = toon(C.innerEar);
  const bowM = toon(C.bow), bowD = toon(C.bowDark), collarM = toon(C.collar);
  const R = { root: new THREE.Group() };
  R.hop = group(R.root);        // vertical offsets (jump / bob / lane sidestep)
  R.squash = group(R.hop);      // squash & stretch, pivot at the feet
  R.body = group(R.squash, [0, 0.45, 0]);   // lean / pitch, pivot at body centre
  const B = group(R.body, [0, -0.45, 0]);
  R.shadow = blobShadow(1.15, 1.35);
  R.root.add(R.shadow);

  // torso: short, round, chubby
  part(G.sphere, fur, { pos: [0, 0.47, -0.04], scale: [0.43, 0.39, 0.5], parent: B });
  part(G.sphere, fur, { pos: [0, 0.5, 0.24], scale: [0.33, 0.33, 0.27], parent: B });   // chest fluff

  // short sturdy legs
  R.legs = {};
  for (const [k, x, z] of [['fl', -0.19, 0.27], ['fr', 0.19, 0.27], ['bl', -0.21, -0.3], ['br', 0.21, -0.3]]) {
    const pv = group(B, [x, 0.3, z]);
    part(capsule(0.1, 0.11), fur, { pos: [0, -0.14, 0], parent: pv });
    part(G.sphere, fur, { pos: [0, -0.245, 0.035], scale: [0.115, 0.07, 0.135], parent: pv });
    R.legs[k] = pv;
  }

  // collar + big purple bow (signature item)
  part(torus(0.33, 0.055), collarM, { pos: [0, 0.71, 0.17], rot: [Math.PI / 2 + 0.42, 0, 0], parent: B });
  const bow = group(B, [0.0, 0.585, 0.5], [-0.1, 0, 0.08]);
  for (const s of [-1, 1]) {
    part(rbox(0.075, 0.21, 0.035, 0.016), bowD, { pos: [s * 0.07, -0.12, -0.03], rot: [0, 0, s * 0.42], parent: bow });
    part(G.sphere, bowM, { pos: [s * 0.15, 0.03, 0], rot: [0, 0, s * 0.3], scale: [0.16, 0.105, 0.065], parent: bow });
    part(G.sphere, toon('#d9b3ff'), { pos: [s * 0.17, 0.07, 0.05], rot: [0, 0, s * 0.3], scale: [0.05, 0.022, 0.015], parent: bow, outline: 0 });
  }
  part(G.sphere, bowM, { pos: [0, 0.01, 0.03], scale: [0.07, 0.078, 0.065], parent: bow });
  R.bow = bow;

  // head: very round, full cheeks
  const head = group(B, [0, 0.99, 0.25]);
  R.head = head;
  part(G.sphere, fur, { scale: [0.45, 0.39, 0.4], parent: head });
  for (const s of [-1, 1]) part(G.sphere, fur, { pos: [s * 0.21, -0.11, 0.1], scale: [0.25, 0.21, 0.25], parent: head });
  for (const s of [-1, 1]) part(G.sphere, fur, { pos: [s * 0.068, -0.135, 0.33], scale: [0.095, 0.078, 0.075], parent: head, outline: 0.55 });
  part(G.sphere, fur, { pos: [0, -0.205, 0.29], scale: [0.07, 0.05, 0.05], parent: head, outline: 0.5 });
  part(noseGeo, pink, { pos: [0, -0.072, 0.4], rot: [-0.25, 0, 0], parent: head, outline: 0.5 });
  const mouthM = flat(C.mouth);
  part(cyl(0.006, 0.006, 0.045, 6), mouthM, { pos: [0, -0.115, 0.402], rot: [0.25, 0, 0], parent: head, outline: 0 });
  for (const s of [-1, 1]) part(torus(0.03, 0.0075, Math.PI), mouthM, { pos: [s * 0.03, -0.138, 0.404], rot: [-0.25, 0, Math.PI], parent: head, outline: 0 });
  // blush
  const blush = flat(C.blush, { opacity: 0.6 });
  for (const s of [-1, 1]) part(G.circle, blush, { pos: [s * 0.27, -0.1, 0.336], rot: [0, s * 0.42, 0], scale: [0.06, 0.04, 1], parent: head, outline: 0 });

  // big round copper eyes with highlights
  R.eyes = []; R.eyeDiscs = []; R.dizzyDiscs = [];
  const eyeM = eyeMaterial(C.iris, 'round');
  const dizzyM = new THREE.MeshBasicMaterial({ map: TEX.dizzy });
  for (const s of [-1, 1]) {
    const eg = group(head, [s * 0.172, 0.025, 0.338], [-0.06, s * 0.4, 0]);
    part(G.sphere, flat(INK), { scale: [0.118, 0.13, 0.05], parent: eg, outline: 0 });
    const disc = part(G.circle, eyeM, { pos: [0, 0, 0.048], scale: [0.107, 0.119, 1], parent: eg, outline: 0 });
    const dz = part(G.circle, dizzyM, { pos: [0, 0, 0.05], scale: [0.107, 0.119, 1], parent: eg, outline: 0 });
    dz.visible = false;
    R.eyes.push(eg); R.eyeDiscs.push(disc); R.dizzyDiscs.push(dz);
  }

  // small rounded ears, set wide apart
  R.ears = [];
  for (const s of [-1, 1]) {
    const eb = group(head, [s * 0.27, 0.24, -0.04], [0, 0, -s * 0.58]);
    const ea = group(eb);
    part(cone(0.14, 0.19, 20), fur, { pos: [0, 0.08, 0], scale: [1, 1, 0.62], parent: ea });
    part(cone(0.085, 0.13, 20), innerEar, { pos: [0, 0.06, 0.04], scale: [1, 1, 0.42], parent: ea, outline: 0 });
    R.ears.push(ea);
  }

  // whiskers
  const wm = flat('#cfc8e0');
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) whisker(head, wm, s, -0.12 + (1 - i) * 0.03, 0.34, 0.11, 0.27, (1 - i) * 0.18);

  // thick fluffy tail
  const tb = group(B, [0, 0.42, -0.48], [-1.15, 0, 0]);
  R.tail = tailChain(tb, fur, { n: 6, r0: 0.105, r1: 0.12, seg: 0.105, curl: 0.27 });

  // dizzy stars (hidden until hit)
  const stars = group(head, [0, 0.42, 0]);
  const starM = toon('#ffd23f');
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    part(starGeo, starM, { pos: [Math.cos(a) * 0.4, Math.sin(i * 2.1) * 0.05, Math.sin(a) * 0.4], scale: 0.075, parent: stars, outline: 0.7 });
  }
  stars.visible = false;
  R.stars = stars;
  return R;
}

/* ---------- STREET CATS: scruffy, grumpy alley cats ---------- */
function catMats(kind) {
  const P = PAL[kind];
  return {
    P,
    fur: P.stripe ? toon('#ffffff', { map: TEX.tabby(P.fur, P.stripe) }) : toon(P.fur),
    furPlain: toon(P.fur),
    belly: toon(P.belly), nose: toon(P.nose), innerEar: toon(P.innerEar), brow: toon(P.brow),
    eye: eyeMaterial(P.iris, 'slit'),
    ink: flat(INK), fang: toon('#fffaf0'), mouth: toon('#5a1530'), tongue: toon('#ff7a9a'),
    whisker: flat(kind === 'black' ? '#e8e2f5' : '#f6f2ff'),
  };
}

function buildCatHead(M, o) {
  const h = new THREE.Group();
  part(G.sphere, M.fur, { scale: [0.3, 0.26, 0.27], parent: h });
  // scruffy cheek tufts + messy head tuft
  for (const s of [-1, 1]) {
    part(cone(0.07, 0.17, 7), M.furPlain, { pos: [s * 0.27, -0.06, 0.02], rot: [0, 0, -s * (Math.PI / 2 + 0.35)], parent: h });
    part(cone(0.06, 0.15, 7), M.furPlain, { pos: [s * 0.23, -0.15, 0.05], rot: [0, 0, -s * (Math.PI / 2 + 0.95)], parent: h });
  }
  part(cone(0.04, 0.12, 6), M.furPlain, { pos: [0.03, 0.25, 0.04], rot: [0.2, 0, -0.35], parent: h });
  part(cone(0.035, 0.1, 6), M.furPlain, { pos: [-0.04, 0.245, 0.02], rot: [0.1, 0, 0.45], parent: h });
  // muzzle + nose
  for (const s of [-1, 1]) part(G.sphere, M.belly, { pos: [s * 0.05, -0.1, 0.212], scale: [0.072, 0.056, 0.06], parent: h, outline: 0.55 });
  part(noseGeo, M.nose, { pos: [0, -0.058, 0.262], rot: [-0.3, 0, 0], scale: 0.78, parent: h, outline: 0.5 });
  // mouth: grumpy frown with small fangs, or open hiss
  if (o.hiss) {
    part(G.sphere, M.mouth, { pos: [0, -0.165, 0.225], scale: [0.085, 0.07, 0.05], parent: h, outline: 0.6 });
    part(G.sphere, M.tongue, { pos: [0, -0.2, 0.245], scale: [0.045, 0.022, 0.035], parent: h, outline: 0 });
    for (const s of [-1, 1]) part(cone(0.02, 0.06, 8), M.fang, { pos: [s * 0.042, -0.13, 0.262], rot: [Math.PI, 0, 0], parent: h, outline: 0.45 });
  } else {
    part(torus(0.038, 0.009, Math.PI), M.ink, { pos: [0, -0.165, 0.258], rot: [-0.2, 0, 0], parent: h, outline: 0 });
    for (const s of [-1, 1]) part(cone(0.014, 0.04, 8), M.fang, { pos: [s * 0.03, -0.172, 0.262], rot: [Math.PI, 0, 0], parent: h, outline: 0.4 });
  }
  // narrowed eyes: slit pupils, heavy slanted lids, angular brows
  for (const s of [-1, 1]) {
    const eg = group(h, [s * 0.11, 0.03, 0.213], [0, s * 0.38, 0]);
    part(G.sphere, M.ink, { scale: [0.086, 0.074, 0.04], parent: eg, outline: 0 });
    part(G.circle, M.eye, { pos: [0, 0, 0.038], scale: [0.076, 0.066, 1], parent: eg, outline: 0 });
    part(G.sphere, M.furPlain, { pos: [0, o.hiss ? 0.068 : 0.056, 0.036], rot: [0, 0, s * 0.42], scale: [0.105, 0.056, 0.03], parent: eg, outline: 0.6 });
    part(capsule(0.019, 0.1), M.brow, { pos: [s * 0.012, 0.098, 0.045], rot: [0, 0, Math.PI / 2 + s * 0.45], parent: eg, outline: 0.5 });
  }
  // ears
  const ears = [];
  for (const s of [-1, 1]) {
    const back = o.hiss ? 1 : 0;
    const eb = group(h, [s * 0.16, 0.18, -0.03], [-0.6 * back, 0, -s * (0.28 + back * 0.9)]);
    const torn = o.tornEar && s === 1;
    if (torn) {
      part(cyl(0.035, 0.1, 0.15, 14), M.furPlain, { pos: [0, 0.07, 0], rot: [0, 0, 0.12], scale: [1, 1, 0.55], parent: eb });
      part(cyl(0.02, 0.055, 0.09, 12), M.innerEar, { pos: [0, 0.055, 0.03], scale: [1, 1, 0.4], parent: eb, outline: 0 });
      part(rbox(0.13, 0.04, 0.02, 0.009), toon('#ffd9a8'), { pos: [0.005, 0.11, 0.04], rot: [0, 0, 0.55], parent: eb, outline: 0.5 });
    } else {
      part(cone(0.1, 0.24, 16), M.furPlain, { pos: [0, 0.1, 0], scale: [1, 1, 0.55], parent: eb });
      part(cone(0.06, 0.15, 16), M.innerEar, { pos: [0, 0.075, 0.03], scale: [1, 1, 0.4], parent: eb, outline: 0 });
    }
    ears.push(eb);
  }
  // whiskers (tabby gets one bent whisker)
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    const bend = (o.bentWhisker && s === 1 && i === 0) ? 0.85 : 0;
    whisker(h, M.whisker, s, -0.095 + (1 - i) * 0.025, 0.235, 0.09, 0.24, (1 - i) * 0.2 - 0.05, bend);
  }
  // ginger's scar: slash across the brow with stitches
  if (o.scar) {
    const sc = group(h, [0.165, 0.06, 0.218], [0, 0.6, 0.35]);
    const m = toon(M.P.scar);
    part(rbox(0.022, 0.2, 0.012, 0.008), m, { parent: sc, outline: 0 });
    for (const y of [-0.05, 0.02, 0.07]) part(rbox(0.07, 0.014, 0.012, 0.005), m, { pos: [0, y, 0.005], rot: [0, 0, 0.15], parent: sc, outline: 0 });
  }
  h.userData.ears = ears;
  return h;
}

function buildStreetCat(kind, pose) {
  const M = catMats(kind);
  const k = kind === 'ginger' ? 1.24 : 1;     // ginger is a bit chunky
  const R = { kind, pose, root: new THREE.Group(), legs: [], phase: Math.random() * 10 };
  R.body = group(R.root);
  R.shadow = blobShadow(0.95 * k, 1.25);
  R.root.add(R.shadow);
  const B = R.body;
  const headOpts = { hiss: pose === 'hiss', tornEar: kind === 'black', bentWhisker: kind === 'tabby', scar: kind === 'ginger' };

  if (pose === 'sit') {
    part(G.sphere, M.fur, { pos: [0, 0.3, -0.07], scale: [0.27 * k, 0.27, 0.28], parent: B });             // hips
    for (const s of [-1, 1]) part(G.sphere, M.fur, { pos: [s * 0.17 * k, 0.22, -0.02], scale: [0.13, 0.17, 0.21], parent: B }); // haunches
    part(G.sphere, M.fur, { pos: [0, 0.6, 0.03], scale: [0.2 * k, 0.28, 0.2], rot: [-0.2, 0, 0], parent: B });  // chest
    part(G.sphere, M.belly, { pos: [0, 0.55, 0.16], scale: [0.13 * k, 0.2, 0.09], rot: [-0.2, 0, 0], parent: B, outline: 0.6 });
    for (const s of [-1, 1]) {
      part(capsule(0.055, 0.3), M.furPlain, { pos: [s * 0.09 * k, 0.24, 0.16], parent: B });
      part(G.sphere, M.furPlain, { pos: [s * 0.09 * k, 0.045, 0.21], scale: [0.07, 0.045, 0.085], parent: B });
      part(G.sphere, M.furPlain, { pos: [s * 0.2 * k, 0.045, 0.14], scale: [0.075, 0.045, 0.12], parent: B });
    }
    R.head = buildCatHead(M, headOpts);
    R.head.position.set(0, 0.98, 0.1);
    R.head.rotation.x = 0.14;      // chin down = glare
    B.add(R.head);
    const tb = group(B, [0.12 * k, 0.07, -0.32], [-Math.PI / 2, 0, -0.5]);
    R.tail = tailChain(tb, M.furPlain, { n: 7, r0: 0.065, r1: 0.05, seg: 0.1, curl: -0.38, curlAxis: 'z', tufts: 3 });
  } else {
    const hiss = pose === 'hiss';
    const legTop = hiss ? 0.68 : 0.5, r = 0.058, L = legTop - r - 0.06;
    const by = legTop + 0.08;
    part(G.sphere, M.fur, { pos: [0, by - (hiss ? 0.06 : 0), 0.22], scale: [0.21 * k, 0.22, 0.24], parent: B });               // chest
    part(G.sphere, M.fur, { pos: [0, by + (hiss ? 0.17 : 0.01), 0], scale: [0.2 * k, hiss ? 0.25 : 0.2, 0.27], parent: B });  // mid / arched back
    part(G.sphere, M.fur, { pos: [0, by - (hiss ? 0.06 : 0), -0.23], scale: [0.21 * k, 0.21, 0.23], parent: B });             // hips
    part(G.sphere, M.belly, { pos: [0, by - 0.06, 0.33], scale: [0.13 * k, 0.15, 0.1], parent: B, outline: 0.6 });
    for (const [x, z] of [[-1, 0.24], [1, 0.24], [-1, -0.24], [1, -0.24]]) {
      const pv = group(B, [x * 0.11 * k, legTop, z]);
      part(capsule(r, L), M.furPlain, { pos: [0, -L / 2, 0], parent: pv });
      part(G.sphere, M.furPlain, { pos: [0, -L - r + 0.02, 0.02], scale: [0.072, 0.048, 0.09], parent: pv });
      R.legs.push(pv);
    }
    if (hiss) {   // puffed-up fur spikes along the arched spine
      for (let i = 0; i < 5; i++) {
        const z = -0.22 + i * 0.11, yy = by + 0.17 + 0.25 * Math.sqrt(Math.max(0, 1 - (z / 0.3) ** 2)) - 0.03;
        part(cone(0.05, 0.14, 6), M.furPlain, { pos: [0, yy, z], rot: [(z) * 2.2, 0, (i % 2 ? 0.25 : -0.25)], parent: B });
      }
    }
    R.head = buildCatHead(M, headOpts);
    R.head.position.set(0, hiss ? by + 0.1 : by + 0.3, 0.44);
    B.add(R.head);
    const tb = group(B, [0, by + 0.06, -0.42], [hiss ? -0.15 : -0.65, 0, 0]);
    R.tail = tailChain(tb, M.furPlain, hiss
      ? { n: 6, r0: 0.11, r1: 0.1, seg: 0.12, curl: -0.03, tufts: 5 }
      : { n: 7, r0: 0.06, r1: 0.05, seg: 0.1, curl: -0.12, tufts: 3 });
    if (!hiss) R.tail.slice(4).forEach(s => { s.rotation.x = 0.45; s.userData.baseCurl = 0.45; });
  }
  return R;
}

function buildLollipop() {

function buildWrapped() {

function buildChocolate() {

    const x = (i - (n - 1) / 2) * 1.3, r = 1.0 + Math.sin(i / (n - 1) * Math.PI) * 0.9 + rng() * 0.3;
    part(G.sphereLo, m, { pos: [x, r * 0.35, (rng() - 0.5) * 0.8], scale: [r, r * 0.8, r], parent: g, outline: 2.5 });
  }
  return g;
}

function buildStreet() {
  const root = new THREE.Group();
  const { roadWidth: RW, sidewalkWidth: SW, streetFrom, streetTo } = LAYOUT;
  const len = streetFrom - streetTo, zc = (streetFrom + streetTo) / 2;
  const rng = mulberry32(1234);

  // ground + road + sidewalks (big flat pieces, no outline needed)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), toon('#ffffff', { map: TEX.grass }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, -0.02, zc);
  root.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(RW, len), toon('#ffffff', { map: TEX.road }));
  road.rotation.x = -Math.PI / 2; road.position.set(0, 0, zc);
  root.add(road);

  const S = new THREE.Group();   // everything here gets baked
  for (const s of [-1, 1]) {
    part(rbox(SW, 0.14, len, 0.03), toon(PAL.street.sidewalk), { pos: [s * (RW / 2 + SW / 2), 0.07, zc], parent: S, outline: 0 });
    part(rbox(0.2, 0.18, len, 0.05), toon(PAL.street.curb), { pos: [s * (RW / 2 + 0.1), 0.09, zc], parent: S, outline: 0.6 });
    const sw = part(new THREE.PlaneGeometry(SW - 0.2, len), toon('#ffffff', { map: TEX.sidewalk }), { pos: [s * (RW / 2 + SW / 2 + 0.1), 0.142, zc], rot: [-Math.PI / 2, 0, 0], parent: S, outline: 0 });
    sw.userData.outline = 0;

    // houses, yards, trees, fences, lamps
    let z = streetFrom - 4;
    while (z > streetTo + 4) {
      const house = buildHouse(rng);
      const hx = s * (RW / 2 + SW + 4.6);
      house.position.set(hx, 0, z);
      house.rotation.y = -s * Math.PI / 2;
      S.add(house);
      const fence = buildPicketFence(4.6);
      fence.position.set(s * (RW / 2 + SW + 0.5), 0, z);
      fence.rotation.y = -s * Math.PI / 2;
      S.add(fence);
      if (rng() < 0.7) { const b = buildBush(rng); b.position.set(s * (RW / 2 + SW + 1.4), 0, z + (rng() - 0.5) * 2); S.add(b); }
      const step = 6.6 + rng() * 1.6;
      const tree = buildTree(rng);
      tree.position.set(s * (RW / 2 + SW + 1.6 + rng() * 0.6), 0, z - step / 2);
      S.add(tree);
      z -= step;
    }
    for (let lz = 8; lz > streetTo + 6; lz -= 12) {
      if (Math.abs(lz - (-12.5)) < 2) continue;
      const lamp = buildLamp(s);
      lamp.position.set(s * (RW / 2 + 0.55), 0.14, lz);
      S.add(lamp);
    }
  }
  root.add(bakeStatic(S));
  return root;
}

TEX.cane = stripesTex('#ffffff', '#ff3b5c', 4, { ratio: 0.5 });
TEX.cane.wrapS = TEX.cane.wrapT = THREE.RepeatWrapping;
const SUGAR = {};
function sugarTex(color) {   // gumdrop sugar crystals
  return SUGAR[color] ??= canvasTex(128, 128, (g, w) => {
    g.fillStyle = color; g.fillRect(0, 0, w, w);
    const rng = mulberry32(color.charCodeAt(1) * 31 + color.charCodeAt(3));
    g.fillStyle = 'rgba(255,255,255,0.6)';
    for (let i = 0; i < 90; i++) circle(g, rng() * w, rng() * w, 1 + rng() * 1.8);
  });
}
let backOL = STYLE.backdrop.outlineSide;   // outline multiplier for whatever is being built
function fp(geometry, color, o = {}) {
  return part(geometry, farToon(color, o.map), { ...o, far: true, outline: o.outline ?? backOL });
}
const SPRINKLES = ['#ff3d7f', '#27c3d8', '#ffe14d', '#9b4dff', '#7fd65a', '#ffffff'];

function chocoMountain(rng, r, h) {
  const g = new THREE.Group();
  fp(cone(r, h, 32), pick(rng, ['#6e3b22', '#7d4429', '#5c301c']), { pos: [0, h / 2, 0], parent: g });
  // frosting cap on the same slope, a lip ring and drips running down
  const f = 0.3 + rng() * 0.12, hc = h * f * 1.05, rc = r * f * 1.05;
  const cap = pick(rng, ['#fff3f9', '#ffaad3', '#ffe9b8', '#c9f2ff']);
  const yb = h * 1.012 - hc;
  fp(cone(rc, hc, 32), cap, { pos: [0, yb + hc / 2, 0], parent: g });
  const phi = Math.atan2(r, h), rd = r * 0.05;
  fp(torus(rc, rd * 0.9), cap, { pos: [0, yb, 0], rot: [Math.PI / 2, 0, 0], parent: g, outline: 0 });
  const n = 8 + Math.floor(rng() * 5);
  for (let i = 0; i < n; i++) {
    const L = r * (0.06 + rng() * 0.17), along = L / 2;
    const dg = group(g, [0, yb, 0], [0, -(i / n * Math.PI * 2 + rng() * 0.3), 0]);
    fp(capsule(rd, L), cap, {
      pos: [rc + Math.sin(phi) * along + Math.cos(phi) * rd * 0.4, -Math.cos(phi) * along + Math.sin(phi) * rd * 0.4, 0],
      rot: [0, 0, phi], parent: dg,
    });
  }
  // point on the cap surface: d = 0 at the apex, 1 at the rim; lifted along the slope normal
  const onCap = (d, a, lift) => [
    Math.cos(a) * (rc * d + Math.cos(phi) * lift), yb + hc * (1 - d) + Math.sin(phi) * lift, Math.sin(a) * (rc * d + Math.cos(phi) * lift)];
  for (let i = 0; i < 7; i++) {   // sprinkles on the cap
    fp(capsule(r * 0.014, r * 0.05), pick(rng, SPRINKLES), {
      pos: onCap(0.25 + rng() * 0.6, rng() * Math.PI * 2, 0), rot: [rng() * 3, rng() * 3, rng() * 3], parent: g, outline: 0,
    });
  }
  const nb = 9 + Math.floor(rng() * 6);
  for (let i = 0; i < nb; i++) {  // jelly beans tumbling over the frosting
    const jr = r * (0.045 + rng() * 0.02);
    fp(capsule(jr, jr * 1.5), pick(rng, JELLY), {
      pos: onCap(0.15 + rng() * 0.85, rng() * Math.PI * 2, jr * 0.5), rot: [rng() * 3, rng() * 3, rng() * 3],
      scale: [1, 1, 0.85], parent: g, outline: backOL * 0.5,
    });
  }
  for (let i = 0; i < 3; i++) {   // a few gumballs
    const gr = r * (0.06 + rng() * 0.03);
    fp(G.sphereLo, pick(rng, JELLY), { pos: onCap(0.3 + rng() * 0.6, rng() * Math.PI * 2, gr * 0.6), scale: gr, parent: g, outline: backOL * 0.5 });
  }
  // a big sweet perched on the summit
  const top = group(g, [0, h * 1.012, 0], [(rng() - 0.5) * 0.4, rng() * 6, (rng() - 0.5) * 0.4]);
  const ts = r * 0.13;
  switch (Math.floor(rng() * 4)) {
    case 0: {   // wrapped candy
      const c = pick(rng, ['#27c3d8', '#ff7ab6', '#ffb02e', '#9b4dff']);
      fp(G.sphereLo, '#ffffff', { map: TEX.wrap, pos: [0, ts * 0.6, 0], scale: [ts * 1.3, ts, ts], parent: top });
      for (const s of [-1, 1]) fp(cone(ts * 0.85, ts * 1.2, 7), c, { pos: [s * ts * 1.85, ts * 0.6, 0], rot: [0, 0, s * Math.PI / 2], parent: top });
      break;
    }
    case 1:     // giant gumball
      fp(G.sphereLo, pick(rng, JELLY), { pos: [0, ts * 0.8, 0], scale: ts * 1.3, parent: top });
      break;
    case 2: {   // lollipop stuck in the peak
      fp(cyl(ts * 0.12, ts * 0.12, ts * 3, 8), '#fffaf3', { pos: [0, ts * 1.2, 0], parent: top, outline: backOL * 0.6 });
      const d = group(top, [0, ts * 3.2, 0]);
      fp(geo('Cylinder', ts * 1.2, ts * 1.2, ts * 0.35, 24, 1, true), '#ff3d7f', { rot: [Math.PI / 2, 0, 0], parent: d });
      for (const s of [-1, 1]) fp(G.circle, '#ffffff', { map: TEX.swirl, pos: [0, 0, s * ts * 0.175], rot: [0, s < 0 ? Math.PI : 0, 0], scale: [ts * 1.2, ts * 1.2, 1], parent: d, outline: 0 });
      break;
    }
    default:    // cherry
      fp(G.sphereLo, '#e8182f', { pos: [0, ts * 0.8, 0], scale: ts, parent: top });
      fp(cyl(ts * 0.08, ts * 0.1, ts * 1.4, 6), '#5d8a2a', { pos: [ts * 0.3, ts * 2.1, 0], rot: [0, 0, -0.45], parent: top, outline: backOL * 0.5 });
  }
  return g;
}
const JELLY = ['#ff3d7f', '#ffe14d', '#7fe05a', '#ff8a1c', '#b57bff', '#27c3d8', '#ff6b6b', '#ffffff'];
function gumdrop(rng, r) {
  const g = new THREE.Group();
  fp(G.sphereMid, '#ffffff', { map: sugarTex(pick(rng, ['#7fe05a', '#ff7ab6', '#ffb02e', '#b57bff', '#27c3d8'])), pos: [0, -r * 0.1, 0], scale: [r, r * 1.05, r], parent: g });
  return g;
}
function candyCane(H) {
  const R = H * 0.16, pts = [];
  for (let i = 0; i <= 6; i++) pts.push(new THREE.Vector3(0, H * 0.85 * i / 6 - H * 0.05, 0));
  for (let i = 1; i <= 10; i++) { const th = Math.PI - Math.PI * i / 10; pts.push(new THREE.Vector3(R + R * Math.cos(th), H * 0.8 + R * Math.sin(th), 0)); }
  pts.push(new THREE.Vector3(2 * R, H * 0.8 - R * 0.55, 0));
  const tube = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal'), 90, H * 0.045, 14);
  const uv = tube.attributes.uv;   // shear the UVs so straight stripes become a spiral
  for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * 11 + uv.getY(i));
  const g = new THREE.Group();
  fp(tube, '#ffffff', { map: TEX.cane, parent: g });
  return g;
}
function giantLollipop(rng, H, R) {
  const g = new THREE.Group();

  const disc = group(g, [0, H + R * 0.92, 0], [0, 0, (rng() - 0.5) * 0.3]);
  fp(geo('Cylinder', R, R, R * 0.28, 40, 1, true), pick(rng, ['#ff3d7f', '#9b4dff']), { rot: [Math.PI / 2, 0, 0], parent: disc });
  for (const s of [-1, 1]) fp(G.circle, '#ffffff', { map: TEX.swirl, pos: [0, 0, s * R * 0.14], rot: [0, s < 0 ? Math.PI : 0, 0], scale: [R, R, 1], parent: disc, outline: 0 });
  part(rbox(R * 0.5, R * 0.2, R * 0.2, R * 0.06), farToon('#ffe14d'), { pos: [0, H - R * 0.05, 0], parent: g, far: true, outline: backOL * 0.7 });
  return g;
}
function softServe(rng, R) {
  const g = new THREE.Group();
  const col = pick(rng, ['#ffb3d9', '#fff3dc', '#a8623a', '#c9f2ff']);

  fp(cone(r * 0.95, r * 2.1, 24), col, { pos: [r * 0.25, y + r * 0.85, 0], rot: [0, 0, -0.4], parent: g });
  if (rng() < 0.6) fp(G.sphereMid, '#e8182f', { pos: [-r * 0.3, y + r * 0.55, r * 0.6], scale: R * 0.16, parent: g });

}

function buildBackdrop() {
  const S = new THREE.Group();
  const rng = mulberry32(2024);
  const place = (obj, x, z, ry = rng() * Math.PI * 2) => { obj.position.set(x, 0, z); obj.rotation.y = ry; S.add(obj); };

  // the horizon at the end of the street: two rows of frosted chocolate mountains
  backOL = STYLE.backdrop.outlineFar;
  for (let x = -150; x <= 150; x += 34 + rng() * 16) { const h = 46 + rng() * 22; place(chocoMountain(rng, h * 0.55, h), x, -220 - rng() * 20); }
  for (let x = -125; x <= 125; x += 22 + rng() * 10) {
    if (Math.abs(x) < 14) continue;   // keep a valley open where the road points
    const h = 24 + rng() * 18; place(chocoMountain(rng, h * 0.6, h), x, -155 - rng() * 30);
  }
  // giant sweets in front of the range, plus a candy-cane gate at the end of the road
  place(candyCane(26), -9, -128, 0);
  place(candyCane(26), 9, -128, Math.PI);
  place(softServe(rng, 11), -32, -138);
  place(bigCupcake(rng, 34), 30, -140);
  place(giantLollipop(rng, 20, 7), 0, -165, 0);
  place(gumdrop(rng, 9), -18, -140);
  place(gumdrop(rng, 7), 19, -134);
  place(giantDonut(rng, 9), 52, -132, -0.3);
  place(bigChocoBar(rng, 22), -58, -134, 0.4);

  // behind the houses on both sides
  backOL = STYLE.backdrop.outlineSide;
  const makers = [
    () => { const r = 4 + rng() * 4; return [gumdrop(rng, r), r]; },
    () => { const R = 3 + rng() * 1.5; return [giantLollipop(rng, 11 + rng() * 6, R), R]; },
    () => [candyCane(15 + rng() * 8), 4],
    () => { const R = 5 + rng() * 3; return [softServe(rng, R), R]; },
    () => { const s = 18 + rng() * 10; return [bigCupcake(rng, s), s * 0.31]; },
    () => { const R = 5 + rng() * 3; return [giantDonut(rng, R), R * 1.4]; },
    () => { const w = 12 + rng() * 6; return [bigChocoBar(rng, w), w * 0.55]; },
  ];
  for (const s of [-1, 1]) {
    let k = s > 0 ? 3 : 0;
    for (let z = 18; z > -120; z -= 13 + rng() * 9) {
      const [obj, ext] = makers[k++ % makers.length]();
      place(obj, s * (27 + ext + rng() * 14), z, -s * Math.PI / 2 + (rng() - 0.5) * 1.2);   // roughly face the street
    }
    for (let z = 10; z > -130; z -= 26 + rng() * 12) {
      const h = 22 + rng() * 16; place(chocoMountain(rng, h * 0.6, h), s * (75 + rng() * 25), z);
    }
  }
  return bakeStatic(S);
}

];
for (const [obj, x, z, ry] of obstacles) {
  obj.position.set(x, 0, z); obj.rotation.y = ry; scene.add(obj);
  if (z !== -12.5) {   // laundry line spans the road, no blob shadow

/* =====================================================================
   10. EFFECTS: comic pop-ups, particles
   ===================================================================== */
const effects = [];
function popText(tex, pos, { height = 0.9, life = 1.1, rise = 0.9, delay = 0, wobble = 0.12 } = {}) {
  const m = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
  const s = new THREE.Sprite(m);
  s.renderOrder = 20;
  s.position.copy(pos);
  s.scale.set(0.001, 0.001, 1);
  scene.add(s);
  effects.push({ kind: 'text', s, base: pos.clone(), age: -delay, life, rise, h: height, aspect: tex.image.width / tex.image.height, wobble });
}
const PARTICLE_GEO = G.sphereLo;
function burst(pos, colors, n = 16) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(i % 3 === 0 ? starGeo : PARTICLE_GEO, flat(colors[i % colors.length]));
    const sz = i % 3 === 0 ? 0.05 : 0.045;
    m.scale.setScalar(sz);
    m.position.copy(pos);
    const a = Math.random() * Math.PI * 2, up = 1.5 + Math.random() * 2.5, sp = 1.6 + Math.random() * 1.8;
    scene.add(m);
    effects.push({ kind: 'particle', m, v: new THREE.Vector3(Math.cos(a) * sp, up, Math.sin(a) * sp), age: 0, life: 0.55 + Math.random() * 0.3, sz, spin: (Math.random() - 0.5) * 12 });
  }
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.age += dt;
    if (e.kind === 'text') {
      if (e.age < 0) continue;
      const u = e.age / e.life;
      const sc = e.h * easeOutBack(Math.min(1, e.age / 0.22));
      e.s.scale.set(sc * e.aspect, sc, 1);
      e.s.position.set(e.base.x, e.base.y + e.rise * (1 - Math.pow(1 - Math.min(u, 1), 2)), e.base.z);
      e.s.material.rotation = Math.sin(e.age * 10) * e.wobble * (1 - u);
      e.s.material.opacity = 1 - smooth(0.7, 1, u);
      if (u >= 1) { scene.remove(e.s); e.s.material.dispose(); effects.splice(i, 1); }
    } else {
      e.v.y -= 7 * dt;
      e.m.position.addScaledVector(e.v, dt);
      e.m.rotation.x += e.spin * dt; e.m.rotation.y += e.spin * dt;
      const u = e.age / e.life;
      e.m.scale.setScalar(e.sz * (1 - u * u));
      if (u >= 1) { scene.remove(e.m); effects.splice(i, 1); }
    }
  }
}

function collectCandy(i) {
  const c = candies[i];
  if (c.state !== 'idle') return;
  c.state = 'pop'; c.t = 0;
  const p = new THREE.Vector3(); c.holder.getWorldPosition(p);
  popText(TEX.pop, p.clone().add(new THREE.Vector3(0, 0.45, 0)), { height: 0.95, life: 0.9, rise: 0.5 });
  popText(TEX.points[c.points], p.clone().add(new THREE.Vector3(0.35, 0.05, 0)), { height: 0.55, life: 1.2, rise: 1.1, delay: 0.12, wobble: 0.05 });
  burst(p, ['#ff3d7f', '#ffe14d', '#27c3d8', '#9b4dff', '#ffffff']);
}

/* =====================================================================
   11. HEROINE ANIMATION
   ===================================================================== */
const ANIM = { base: 'idle', runW: 0, action: null, at: 0, t: 0, blinkT: 0, nextBlink: 2 };
const ACTION_DUR = { jump: 0.95, duck: 1.15, hit: 1.8, laneL: 0.42, laneR: 0.42 };

function newPose() {
  return { hopY: 0, offX: 0, offZ: 0, sy: 1, sx: 1, pitch: 0, roll: 0, yaw: 0, headPitch: 0, headRoll: 0, headYaw: 0,
    earL: 0, earR: 0, fl: 0, fr: 0, bl: 0, br: 0, swish: 0, lift: 0 };
}
function idlePose(t) {
  const p = newPose();
  const br = Math.sin(t * 2.2);
  p.sy = 1 + br * 0.025; p.sx = 1 - br * 0.01;
  p.swish = Math.sin(t * 1.7) * 0.55;
  p.headRoll = Math.sin(t * 0.9) * 0.06; p.headPitch = Math.sin(t * 0.7) * 0.03;
  p.earL = Math.max(0, Math.sin(t * 0.8 + 1)) ** 8 * 0.35; p.earR = Math.max(0, Math.sin(t * 0.8 + 2.2)) ** 8 * 0.35;  // occasional ear twitch
  return p;
}
function runPose(t) {
  const p = newPose();
  const ph = t * 13;
  p.hopY = Math.abs(Math.sin(ph)) * 0.14;
  p.sy = 1 + Math.cos(ph * 2) * -0.06;
  p.pitch = 0.1 + Math.sin(ph * 2) * 0.04;
  p.fl = Math.sin(ph) * 0.95; p.fr = Math.sin(ph + 0.7) * 0.95;
  p.bl = Math.sin(ph + Math.PI) * 0.95; p.br = Math.sin(ph + Math.PI + 0.7) * 0.95;
  p.earL = Math.sin(ph * 2 - 0.9) * 0.22 - 0.15; p.earR = Math.sin(ph * 2 - 1.2) * 0.22 - 0.15;
  p.swish = Math.sin(ph * 0.5) * 0.45; p.lift = 0.4 + Math.sin(ph * 2 - 1) * 0.25;
  p.headPitch = -Math.sin(ph * 2 - 0.5) * 0.05 - 0.05;
  return p;
}
function mixPose(a, b, w) { const p = {}; for (const k in a) p[k] = lerp(a[k], b[k], w); return p; }

function triggerAnim(name) {
  if (name === 'idle' || name === 'run') { ANIM.base = name; refreshAnimButtons(); return; }
  ANIM.action = name; ANIM.at = 0;
  if (name === 'hit') {
    const p = new THREE.Vector3(); heroine.head.getWorldPosition(p);
    popText(TEX.bonk, p.add(new THREE.Vector3(0, 0.75, 0)), { height: 1.05, life: 1.3, rise: 0.35, wobble: 0.2 });
  }
}

function animateHeroine(dt) {
  ANIM.t += dt;
  const t = ANIM.t;
  ANIM.runW = lerp(ANIM.runW, ANIM.base === 'run' ? 1 : 0, 1 - Math.exp(-dt * 7));
  const p = mixPose(idlePose(t), runPose(t), ANIM.runW);
  const running = ANIM.runW > 0.5;
  let dizzy = false, stars = false;

  if (ANIM.action) {
    ANIM.at += dt;
    const d = ACTION_DUR[ANIM.action], s = ANIM.at, u = Math.min(s / d, 1);
    switch (ANIM.action) {
      case 'jump': {
        if (u < 0.1) {                        // anticipation squash
          const k = u / 0.1;
          p.hopY = lerp(p.hopY, 0, k); p.sy = 1 - 0.3 * Math.sin(k * Math.PI / 2); p.sx = 1 + 0.08 * k;
          p.fl = p.fr = lerp(p.fl, 0.3, k); p.bl = p.br = lerp(p.bl, -0.3, k);
        } else if (u < 0.82) {                // airborne: stretch -> tuck -> reach
          const k = (u - 0.1) / 0.72;
          p.hopY = 4 * 1.5 * k * (1 - k);
          p.sy = k < 0.22 ? lerp(1.32, 0.9, k / 0.22) : k < 0.62 ? 0.9 : lerp(0.9, 1.14, (k - 0.62) / 0.38);
          p.sx = 1;
          const [f, b] = k < 0.4 ? [lerp(-0.9, 1.25, k / 0.4), lerp(0.9, -1.25, k / 0.4)] : [lerp(1.25, -0.6, (k - 0.4) / 0.6), lerp(-1.25, 0.35, (k - 0.4) / 0.6)];
          p.fl = p.fr = f; p.bl = p.br = b;
          p.pitch = lerp(-0.38, 0.3, k);
          p.earL = p.earR = lerp(-0.7, 0.35, k);
          p.lift = lerp(-0.6, 0.9, k);
          p.headPitch = lerp(-0.15, 0.1, k);
        } else {                              // landing squash with overshoot
          const k = (u - 0.82) / 0.18;
          p.hopY = 0; p.sy = 0.66 + 0.34 * easeOutBack(k); p.sx = 1 + 0.14 * (1 - k);
          p.pitch = 0.12 * (1 - k);
          p.fl = p.fr = -0.35 * (1 - k); p.bl = p.br = 0.35 * (1 - k);
          p.earL = p.earR = 0.4 * (1 - k);
        }
        break;
      }
      case 'duck': {
        const w = smooth(0, 0.12, s) * (1 - smooth(d - 0.22, d, s));
        p.sy = lerp(p.sy, 0.5, w); p.sx = lerp(p.sx, 1.3, w);
        p.hopY *= 1 - w; p.pitch = lerp(p.pitch, 0.06, w);
        p.earL = p.earR = lerp(p.earL, -1.15, w);
        const f = running ? -1.25 : -0.6, b = running ? 1.25 : 0.6;
        p.fl = p.fr = lerp(p.fl, f, w); p.bl = p.br = lerp(p.bl, b, w);
        p.lift = lerp(p.lift, -0.7, w); p.headPitch = lerp(p.headPitch, -0.12, w);
        break;
      }
      case 'hit': {
        dizzy = u < 0.9; stars = u < 0.94;
        const kb = Math.exp(-s * 3.2), fade = 1 - smooth(0.55, 1, u);
        p.offZ = -0.35 * Math.sin(Math.min(s / 0.25, 1) * Math.PI / 2) * fade;
        p.hopY = s < 0.36 ? 4 * 0.3 * (s / 0.36) * (1 - s / 0.36) : 0;
        p.sy = 1 - 0.3 * Math.exp(-s * 5) * Math.cos(s * 18);
        p.roll = Math.sin(s * 7) * 0.28 * fade; p.pitch = -0.28 * kb + Math.sin(s * 5) * 0.08 * fade;
        p.headRoll = Math.sin(s * 9) * 0.3 * fade; p.headYaw = Math.sin(s * 6) * 0.25 * fade;
        p.earL = -0.7 * fade; p.earR = -0.5 * fade;
        p.fl = Math.sin(s * 12) * 0.4 * fade; p.fr = -p.fl; p.bl = Math.sin(s * 12 + 1) * 0.3 * fade; p.br = -p.bl;
        break;
      }
      case 'laneL': case 'laneR': {
        const dir = ANIM.action === 'laneL' ? 1 : -1;   // local +X = screen-left in game view
        const e = Math.sin(u * Math.PI);
        p.offX = dir * 0.5 * e; p.roll = -dir * 0.4 * e; p.yaw = dir * 0.32 * e;
        p.hopY += 0.12 * e; p.sy *= 1 - 0.07 * e;
        p.headRoll += dir * 0.15 * e; p.swish = -dir * 0.8 * e;
        break;
      }
    }
    if (u >= 1) ANIM.action = null;
  }

  // blinking
  ANIM.nextBlink -= dt;
  if (ANIM.nextBlink <= 0) { ANIM.blinkT = 0.15; ANIM.nextBlink = 1.8 + Math.random() * 2.8; if (Math.random() < 0.25) ANIM.nextBlink = 0.3; }
  ANIM.blinkT = Math.max(0, ANIM.blinkT - dt);
  const eyeOpen = ANIM.blinkT > 0 ? 1 - Math.sin((1 - ANIM.blinkT / 0.15) * Math.PI) * 0.92 : 1;

  // apply
  const R = heroine;
  R.hop.position.set(p.offX, p.hopY, p.offZ);
  const sxz = 1 / Math.sqrt(p.sy);
  R.squash.scale.set(sxz * p.sx, p.sy, sxz);
  R.body.rotation.set(p.pitch, p.yaw, p.roll);
  R.head.rotation.set(p.headPitch, p.headYaw, p.headRoll);
  R.head.scale.set(1 / Math.sqrt(sxz * p.sx), 1 / Math.sqrt(p.sy), 1 / Math.sqrt(sxz));   // head keeps its roundness
  R.ears[0].rotation.x = p.earL; R.ears[1].rotation.x = p.earR;
  R.legs.fl.rotation.x = p.fl; R.legs.fr.rotation.x = p.fr; R.legs.bl.rotation.x = p.bl; R.legs.br.rotation.x = p.br;
  R.tail.forEach((sg, i) => { sg.rotation.x = sg.userData.baseCurl + p.lift * 0.12; sg.rotation.z = p.swish * (0.18 + i * 0.07); });
  R.eyes.forEach(e => { e.scale.y = dizzy ? 1 : eyeOpen; });
  R.eyeDiscs.forEach(d => { d.visible = !dizzy; });
  R.dizzyDiscs.forEach((d, i) => { d.visible = dizzy; d.rotation.z = -t * 9 * (i ? 1 : -1); });
  R.stars.visible = stars;
  if (stars) { R.stars.rotation.y = t * 5; R.stars.children.forEach((c, i) => { c.rotation.z = t * 6 + i; }); }
  R.shadow.position.set(p.offX, 0.012, p.offZ);
  R.shadow.scale.set(1.15 / (1 + p.hopY * 0.6), 1.35 / (1 + p.hopY * 0.6), 1);
  R.shadow.material.opacity = STYLE.shadow.opacity / (1 + p.hopY * 0.9);
}

/* ---------- street cat idle loops ---------- */
function animateCats(dt, t) {
  // sitting: breathing, glare, tail-tip flicks
  {
    const R = catSit, tt = t + R.phase;
    R.body.scale.y = 1 + Math.sin(tt * 2) * 0.015;
    const flick = Math.max(0, Math.sin(tt * 1.3)) ** 6;
    R.tail.forEach((s, i) => { s.rotation.z = s.userData.baseCurl + Math.sin(tt * 2 + i * 0.6) * 0.05; s.rotation.x = i > 3 ? flick * 0.6 : 0; });
    R.head.rotation.y = Math.sin(tt * 0.5) * 0.25 - 0.2;
  }
  // pacing: walk back and forth, glance at the camera side
  {
    const R = catPace, P = R.pace, tt = t + R.phase;
    const speed = 0.75;
    const turning = Math.abs(R.root.rotation.y - P.yaw) > 0.05;
    if (!turning) {
      R.root.position.x += P.dir * speed * dt;
      if (R.root.position.x > P.b) { P.dir = -1; P.yaw = -Math.PI / 2; }
      if (R.root.position.x < P.a) { P.dir = 1; P.yaw = Math.PI / 2; }
    }
    R.root.rotation.y = lerp(R.root.rotation.y, P.yaw, 1 - Math.exp(-dt * 6));
    const ph = tt * 8.5;
    const walk = turning ? 0.3 : 1;
    R.legs[0].rotation.x = Math.sin(ph) * 0.55 * walk; R.legs[3].rotation.x = Math.sin(ph) * 0.55 * walk;
    R.legs[1].rotation.x = -Math.sin(ph) * 0.55 * walk; R.legs[2].rotation.x = -Math.sin(ph) * 0.55 * walk;
    R.body.position.y = Math.abs(Math.cos(ph)) * 0.035;
    R.body.rotation.z = Math.sin(ph) * 0.03;
    R.head.rotation.y = lerp(R.head.rotation.y, -P.dir * 0.75, 1 - Math.exp(-dt * 3));
    R.head.rotation.x = Math.sin(ph * 2) * 0.03;
    R.tail.forEach((s, i) => { s.rotation.z = Math.sin(tt * 3 - i * 0.5) * 0.12; });
  }
  // hissing: trembling, puffed tail shiver, bubble pulse
  {
    const R = catHiss, tt = t + R.phase;
    R.body.position.x = Math.sin(tt * 41) * 0.008;
    R.body.position.y = Math.abs(Math.sin(tt * 23)) * 0.01;
    R.tail.forEach((s, i) => { s.rotation.z = Math.sin(tt * 30 + i) * 0.03; });
    const pulse = 1 + Math.sin(tt * 7) * 0.06 + Math.max(0, Math.sin(tt * 2.1)) ** 12 * 0.15;
    hissSprite.scale.set(1.5 * pulse, 0.94 * pulse, 1);
    hissSprite.material.rotation = Math.sin(tt * 3) * 0.06;
  }
}

let viewMode = 'showcase';
let camTween = null;
function goView(name) {
  viewMode = name;
  const v = viewFor(name);
  camTween = { t: 0, dur: 1.2, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: new THREE.Vector3().fromArray(v.pos), toT: new THREE.Vector3().fromArray(v.target) };
  controls.enabled = false;
  const game = name === 'game';
  platform.visible = !game;
  heroine.root.position.y = game ? 0 : 0.14;
  if (game) {
    // face down the street (-Z) and start running
    turntable.rotation.y = ((turntable.rotation.y % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    ANIM.targetYaw = Math.PI;
    triggerAnim('run');
  } else {
    ANIM.targetYaw = null;
  }
  document.getElementById('camGame').classList.toggle('on', game);
  document.getElementById('camShow').classList.toggle('on', !game);
}
function updateCamera(dt) {
  if (camTween) {
    camTween.t += dt;
    const k = easeInOut(Math.min(camTween.t / camTween.dur, 1));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    if (camTween.t >= camTween.dur) { camTween = null; controls.enabled = true; }
  }
  controls.update();
}

const slCanvas = $('speedlines'), slg = slCanvas.getContext('2d');
const lines = Array.from({ length: 30 }, () => ({ a: 0, r: 0, len: 0, w: 0, sp: 0 }));
function respawnLine(l, fresh) {
  l.a = Math.random() * Math.PI * 2; l.r = fresh ? 0.6 + Math.random() * 0.5 : 0.62 + Math.random() * 0.1;
  l.len = 0.12 + Math.random() * 0.22; l.w = 2 + Math.random() * 5; l.sp = 1.2 + Math.random() * 1.6;
}
lines.forEach(l => respawnLine(l, true));
let slAlpha = 0;
function drawSpeedLines(dt) {
  const target = speedLinesOn && ANIM.runW > 0.5 ? (viewMode === 'game' ? 1 : 0.55) : 0;
  slAlpha = lerp(slAlpha, target, 1 - Math.exp(-dt * 5));
  const W = slCanvas.width, H = slCanvas.height;
  slg.clearRect(0, 0, W, H);
  if (slAlpha < 0.01) return;
  const cx = W / 2, cy = H * 0.46, R = Math.hypot(W, H) / 2;
  slg.fillStyle = `rgba(255,255,255,${0.75 * slAlpha})`;
  for (const l of lines) {
    l.r += l.sp * dt;
    if (l.r > 1.15) respawnLine(l, false);
    const r0 = l.r * R, r1 = (l.r + l.len) * R, ca = Math.cos(l.a), sa = Math.sin(l.a), px = -sa, py = ca, w = l.w * renderer.getPixelRatio();
    slg.beginPath();
    slg.moveTo(cx + ca * r0, cy + sa * r0);
    slg.lineTo(cx + ca * r1 + px * w, cy + sa * r1 + py * w);
    slg.lineTo(cx + ca * r1 - px * w, cy + sa * r1 - py * w);
    slg.closePath(); slg.fill();
  }
}

/* =====================================================================
   15. MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // turntable
  if (ANIM.targetYaw != null) {
    turntable.rotation.y = lerp(turntable.rotation.y, ANIM.targetYaw + Math.PI * 2 * Math.round((turntable.rotation.y - ANIM.targetYaw) / (Math.PI * 2)), 1 - Math.exp(-dt * 6));
  } else if (spin) {
    turntable.rotation.y += dt * 0.45;
  }

  animateHeroine(dt);
  animateCats(dt, t);

  // candies: float, spin, bob; pop & respawn
  for (const c of candies) {
    c.holder.rotation.y += dt * (c.points === 100 ? 1.0 : 1.5);
    c.holder.position.y = 1.15 + Math.sin(t * 2.2 + c.phase) * 0.12;
    c.shadow.scale.setScalar(0.55 - Math.sin(t * 2.2 + c.phase) * 0.05);
    if (c.state === 'pop') {
      c.t += dt;
      const k = c.t / 0.22;
      c.model.scale.setScalar(k < 0.4 ? 1 + k * 0.8 : Math.max(0, 1.32 * (1 - (k - 0.4) / 0.6)));
      c.shadow.visible = k < 1;
      if (c.t > 1.6) { c.state = 'spawn'; c.t = 0; c.shadow.visible = true; }
    } else if (c.state === 'spawn') {
      c.t += dt;
      const k = Math.min(c.t / 0.45, 1);
      c.model.scale.setScalar(easeOutBack(k));
      if (k >= 1) c.state = 'idle';
    }
    c.model.children.forEach(ch => {
      if (ch.userData.sparkle === undefined) return;
      const a = t * 1.6 + ch.userData.sparkle * 2.1;
      ch.position.set(Math.cos(a) * 0.42, 0.15 + Math.sin(a * 1.7) * 0.25, Math.sin(a) * 0.42);
      const tw = 0.5 + 0.5 * Math.sin(t * 6 + ch.userData.sparkle * 2);
      ch.scale.setScalar(0.1 + tw * 0.18);
      ch.material.opacity = 0.4 + tw * 0.6;
    });
  }

  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 60) c.position.x = -60; }

  updateEffects(dt);
  updateCamera(dt);
  sky.position.copy(camera.position);
  drawSpeedLines(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
$('loading').classList.add('gone');
setTimeout(() => $('loading').remove(), 500);
// console handle for live tweaking: styleLab.STYLE, styleLab.setOutlineThickness(0.03), ...
window.styleLab = { STYLE, camera, controls, triggerAnim, goView, setOutlineThickness, setOutlineEnabled, setShadingSteps };
</script>
</body>
</html>
